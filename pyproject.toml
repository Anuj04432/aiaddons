[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiaddons"
version = "0.2.0"
description = "AI Add-ons Manager - Package & Integration Manager for AI Agents"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anuj04432", email = "anujwagmore835@gmail.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "packaging>=23.0",
    "pyyaml>=6.0",
    "filelock>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
aiaddons = "aiaddons.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiaddons"]

[tool.hatch.build.targets.wheel.force-include]
"registry/addons" = "aiaddons/registry/addons"
"registry/stacks" = "aiaddons/registry/stacks"

[tool.hatch.build.targets.sdist.force-include]
"registry/addons" = "registry/addons"
"registry/stacks" = "registry/stacks"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["aiaddons"]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["B008"]
